<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>TODO Calendar</title>

	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- Bootstrap Icons -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

	<!-- Minimal custom style (Bootstrapベースのまま、安っぽさだけ除去) -->
	<style>
		:root {
			--app-bg: #f6f7fb;
		}

		body {
			background: var(--app-bg);
		}

		.app-shell {
			max-width: 1100px;
		}

		.card-soft {
			border: 0;
			border-radius: 16px;
			box-shadow: 0 10px 30px rgba(16, 24, 40, .06);
		}

		.pill {
			border-radius: 999px;
		}

		.task-row {
			border-radius: 12px;
			transition: transform .12s ease, box-shadow .12s ease;
		}

		.task-row:hover {
			transform: translateY(-1px);
			box-shadow: 0 8px 20px rgba(16, 24, 40, .08);
		}

		.task-title {
			font-weight: 600;
			letter-spacing: .2px;
		}

		.muted {
			color: #667085;
		}

		.btn-icon {
			width: 38px;
			display: inline-flex;
			align-items: center;
			justify-content: center;
		}

		.form-control,
		.form-select {
			border-radius: 12px;
		}

		.input-group>.btn,
		.input-group>.form-control {
			border-radius: 12px;
		}

		/* input-groupの角を綺麗に */
		.input-group .form-control {
			border-top-right-radius: 0;
			border-bottom-right-radius: 0;
		}

		.input-group .btn {
			border-radius: 0;
		}

		.input-group .btn:last-child {
			border-top-right-radius: 12px;
			border-bottom-right-radius: 12px;
		}

		/* list-groupをカード風に */
		.list-group-item {
			border: 0;
			padding: 14px 14px;
			background: transparent;
		}

		.divider {
			height: 1px;
			background: rgba(16, 24, 40, .08);
			margin: 0 14px;
		}

		/* 完了時 */
		.completed {
			text-decoration: line-through;
			opacity: .55;
		}
	</style>
</head>

<body>
	<div class="container py-4 app-shell">

		<!-- Top Bar -->
		<div class="d-flex align-items-center justify-content-between mb-3">
			<div>
				<div class="d-flex align-items-center gap-2">
					<div class="rounded-circle bg-white shadow-sm d-inline-flex align-items-center justify-content-center"
						style="width:44px;height:44px;">
						<i class="bi bi-check2-circle fs-4"></i>
					</div>
					<div>
						<div class="h3 mb-0">TODO Calendar</div>
						<div class="small muted">軽量・高速・毎日運用しやすいToDo</div>
					</div>
				</div>
			</div>

			<div class="d-flex align-items-center gap-2">
				<!-- 全未完了リセット -->
				<form th:action="@{/reset-all}" method="post"
					onsubmit="return confirm('すべてのタスクを未完了に戻します。本当によろしいですか？');">
					<button type="submit" class="btn btn-outline-warning pill">
						<i class="bi bi-arrow-counterclockwise me-1"></i>
						全リセット
					</button>
				</form>
			</div>
		</div>

		<!-- Search Card -->
		<div class="card card-soft mb-3">
			<div class="card-body p-3 p-md-4">
				<form th:action="@{/}" method="get">
					<div class="d-flex align-items-center justify-content-between mb-2">
						<div class="fw-semibold">検索</div>
						<div class="small muted">Enterで検索 / ✕でクリア</div>
					</div>

					<div class="input-group">
						<input type="text" name="q" class="form-control" placeholder="タスクを検索（例：レポート、買い物）"
							th:value="${q}">
						<button class="btn btn-outline-secondary btn-icon" type="submit" title="検索">
							<i class="bi bi-search"></i>
						</button>
						<a th:href="@{/}" class="btn btn-outline-secondary btn-icon" title="検索条件をクリア">
							<i class="bi bi-x-lg"></i>
						</a>
					</div>
				</form>
			</div>
		</div>

		<!-- Add Task Card -->
		<div class="card card-soft mb-3">
			<div class="card-body p-3 p-md-4">
				<div class="d-flex align-items-center justify-content-between mb-3">
					<div class="fw-semibold">新規タスク</div>
					<div class="small muted">タイトル・優先度・期限をまとめて登録</div>
				</div>

				<form th:action="@{/add}" method="post" th:object="${newTask}"
					class="row g-2 g-md-3 align-items-center">
					<div class="col-12 col-lg-6">
						<input type="text" th:field="*{title}" class="form-control" placeholder="例：牛乳を買う / レポート提出"
							required>
					</div>

					<div class="col-6 col-lg-2">
						<select th:field="*{priority}" class="form-select">
							<option th:each="p : ${priorities}" th:value="${p}" th:text="${p}"></option>
						</select>
					</div>

					<div class="col-6 col-lg-3">
						<input type="date" th:field="*{dueDate}" class="form-control">
					</div>

					<div class="col-12 col-lg-1 d-grid">
						<button type="submit" class="btn btn-primary pill">
							<i class="bi bi-plus-lg me-1"></i>
							Add
						</button>
					</div>
				</form>
			</div>
		</div>


		<!-- Task List Card -->
		<div class="card card-soft">
			<div class="card-body p-0">
				<div class="px-3 px-md-4 pt-3 pt-md-4 pb-2 d-flex align-items-center justify-content-between">
					<div class="fw-semibold">タスク一覧</div>

					<div class="d-flex align-items-center gap-3">
						<form method="get" action="/sort" class="m-0">
							<select name="type" class="form-select form-select-sm" onchange="this.form.submit()">
								<option value="createdAt" th:selected="${type == 'createdAt'}">作成日</option>
								<option value="priority" th:selected="${type == 'priority'}">優先度</option>
								<option value="completed" th:selected="${type == 'completed'}">未完了優先</option>
							</select>
						</form>

						<div class="small muted">完了ボタンでトグル / Deleteで削除</div>
					</div>
				</div>


				<ul class="list-group list-group-flush px-2 px-md-3 pb-2 pb-md-3">

					<li th:each="task, stat : ${tasks}" class="list-group-item">
						<div class="bg-white task-row p-3 p-md-3 d-flex justify-content-between align-items-center">

							<!-- Left -->
							<div class="pe-3" style="min-width: 0;">
								<div class="d-flex align-items-center gap-2 flex-wrap">
									<div class="task-title text-truncate" th:text="${task.title}"
										th:classappend="${task.completed} ? ' completed' : ''"
										style="max-width: 520px;">
										title
									</div>

									<span th:if="${task.priority != null}" class="badge pill" th:classappend="${
                task.priority.name() == 'HIGH' ? ' text-bg-danger' :
                (task.priority.name() == 'MEDIUM' ? ' text-bg-secondary' : ' text-bg-primary')
              }" th:text="${task.priority}">
										PRIORITY
									</span>

									<span class="small muted" th:if="${task.dueDate != null}">
										<i class="bi bi-calendar3 me-1"></i>
										<span th:text="${task.dueDate}"></span>
									</span>

									<span class="badge text-bg-light pill" th:if="${task.completed}">
										<i class="bi bi-check2 me-1"></i>完了
									</span>
								</div>
							</div>

							<!-- Right -->
							<div class="d-flex gap-2 align-items-center">
								<form th:action="@{/complete/{id}(id=${task.id})}" method="post" class="m-0">
									<button type="submit" class="btn pill"
										th:classappend="${task.completed} ? ' btn-outline-secondary' : ' btn-success'">
										<i class="bi"
											th:classappend="${task.completed} ? ' bi-arrow-counterclockwise' : ' bi-check2'"></i>
										<span class="ms-1" th:text="${task.completed} ? '戻す' : '完了'">完了</span>
									</button>
								</form>

								<a th:href="@{/delete/{id}(id=${task.id})}" class="btn btn-outline-danger pill">
									<i class="bi bi-trash3 me-1"></i>Delete
								</a>
							</div>

						</div>

						<div th:if="${!stat.last}" class="divider"></div>
					</li>


					<!-- tasksが空の時 -->
					<li class="list-group-item" th:if="${#lists.isEmpty(tasks)}">
						<div class="text-center py-5">
							<div class="fs-4 mb-2">タスクがありません</div>
							<div class="muted">上のフォームから追加してみてください。</div>
						</div>
					</li>

				</ul>
			</div>
		</div>

		<div class="text-center small muted mt-3">
			© TODO Calendar
		</div>

	</div>

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

	<!-- Notification (既存ロジック保持) -->
	<script>
		async function notifyIfTodayTasksIncomplete() {
			try {
				const res = await fetch('/api/tasks/today/incomplete');
				if (!res.ok) return;

				const tasks = await res.json();
				if (!tasks || tasks.length === 0) return;

				if (!("Notification" in window)) return;

				if (Notification.permission === "default") {
					await Notification.requestPermission();
				}
				if (Notification.permission !== "granted") return;

				const titles = tasks.slice(0, 3).map(t => "・" + t.title).join("\n");
				const more = tasks.length > 3 ? `\n…他 ${tasks.length - 3}件` : "";

				new Notification("17:00 リマインド", {
					body: `今日のタスクがまだ残ってるよ（${tasks.length}件）\n${titles}${more}`
				});

			} catch (e) {
				console.error(e);
			}
		}

		function schedule17Notification() {
			const now = new Date();
			const target = new Date();
			target.setHours(17, 0, 0, 0);
			if (now >= target) return;

			const ms = target.getTime() - now.getTime();
			setTimeout(() => {
				notifyIfTodayTasksIncomplete();
			}, ms);
		}

		document.addEventListener("DOMContentLoaded", () => {
			schedule17Notification();
		});
	</script>
</body>

</html>
