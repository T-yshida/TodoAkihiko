<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"> <!-- Thymeleafテンプレートとして使用することを宣言 -->

<head>
	<title>TODO List</title>
	<!-- Bootstrap CSSの読み込み -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
	<div class="container mt-5">
		<h1 class="text-center">TODO List</h1>

		<!-- タスク追加フォーム -->
		<form th:action="@{/add}" method="post" th:object="${newTask}" class="d-flex mt-4">
			<!-- タスクのタイトルを入力するフィールド -->
			<input type="text" name="title" th:field="*{title}" class="form-control me-2" placeholder="New Task"
				required>
			<select th:field="*{priority}" class="form-select" style="max-width: 140px;">
				<option th:each="p : ${priorities}" th:value="${p}" th:text="${p}">
				</option>
			</select>
			<div class="col-md-4">
				<input type="date" th:field="*{dueDate}" class="form-control">
			</div>
			<!-- タスクを追加するための送信ボタン -->
			<button type="submit" class="btn btn-primary">Add</button>
		</form>

		<!-- タスク一覧表示 -->
		<ul class="list-group mt-4">
			<!-- タスクを繰り返し表示する -->
			<li th:each="task : ${tasks}" class="list-group-item d-flex justify-content-between align-items-center">

				<div>
					<span th:text="${task.title}"></span>
					<span class="badge text-bg-secondary" th:if="${task.priority != null}" th:text="${task.priority}"></span>
					<small class="text-muted ms-2" th:if="${task.dueDate != null}">
						（期限：<span th:text="${task.dueDate}"></span>）
					</small>
				</div>

				<a th:href="@{/delete/{id}(id=${task.id})}" class="btn btn-danger btn-sm">Delete</a>
			</li>

		</ul>
	</div>

	<!-- Bootstrap JavaScriptの読み込み -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
