<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TODO Calendar</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>
:root { --app-bg:#f6f7fb; }
body { background:var(--app-bg); }
.app-shell { max-width:1100px; }
.card-soft {
  border:0; border-radius:16px;
  box-shadow:0 10px 30px rgba(16,24,40,.06);
}
.pill { border-radius:999px; }
.task-row {
  border-radius:12px;
  transition:.12s;
}
.task-row:hover {
  transform:translateY(-1px);
  box-shadow:0 8px 20px rgba(16,24,40,.08);
}
.task-title { font-weight:600; }
.muted { color:#667085; }
.divider {
  height:1px;
  background:rgba(16,24,40,.08);
  margin:0 14px;
}
.completed { text-decoration:line-through; opacity:.55; }

#assistant-widget {
  position: fixed;
  left: 20px;
  bottom: 20px;
  width: 300px;
  z-index: 1000;
  transition: all 0.3s ease;
  cursor: pointer;
}

/* キャラ */
.assistant-image {
  width: 300px;
  transition: transform 0.15s ease;
}

/* 吹き出し */
.speech-bubble {
  background: white;
  border-radius: 20px;
  padding: 14px 18px;
  margin-bottom: 6px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.15);
  opacity: 1;
  transition: opacity 0.8s ease;
}

/* ミニフッター */
.assistant-mini-footer {
  font-weight: bold;
  color: #4f6ef7;
  margin-top: 4px;
}

/* 詳細エリア */
.assistant-detail {
  display: none;
  margin-top: 12px;
  background: rgba(255,255,255,0.9);
  border-radius: 16px;
  padding: 12px;
}

/* 拡張状態 */
#assistant-widget.expanded {
  width: 360px;
}

#assistant-widget.expanded .assistant-detail {
  display: block;
}

#assistant-widget.expanded .assistant-mini-footer {
  display: none;
}
/* タップ時のリアクション */
.assistant-main:active .assistant-image {
  transform: scale(0.96);
}

/* 再生中にちょっと浮かせる */
.assistant-speaking .assistant-image {
  animation: speakFloat 0.6s ease-in-out infinite alternate;
}

@keyframes speakFloat {
  from { transform: translateY(0); }
  to   { transform: translateY(-6px); }
}
.todo-area {
  flex: 1;
  padding: 10px 10px;
  overflow-y: auto;
}
.container py-4 app-shell {
  display: flex;
  height: 100vh;
}
.todo-container {
  max-width: 950px;
  margin-left: auto;
}
</style>
</head>

<body>
<div class="container py-4 app-shell">
<div class="todo-area">
	<div class="todo-container">
<!-- ===== Header ===== -->
<div class="d-flex justify-content-between align-items-center mb-3">
  <div>
    <h3 class="mb-0">TODO Calendar</h3>
    <div class="small muted">検索・ジャンル対応ToDo</div>
  </div>
  <form th:action="@{/reset-all}" method="post"
        onsubmit="return confirm('すべて未完了に戻しますか？');">
    <button class="btn btn-outline-warning pill">
      <i class="bi bi-arrow-counterclockwise me-1"></i>全リセット
    </button>
  </form>
</div>

<!-- ===== Search ===== -->
<div class="card card-soft mb-3">
  <div class="card-body">
    <form th:action="@{/}" method="get" class="input-group">
      <input type="text" name="q" class="form-control"
             placeholder="検索（例：レポート）" th:value="${q}">
      <button class="btn btn-outline-secondary">
        <i class="bi bi-search"></i>
      </button>
      <a th:href="@{/}" class="btn btn-outline-secondary">
        <i class="bi bi-x-lg"></i>
      </a>
    </form>
  </div>
</div>

<!-- ===== Add Task ===== -->
<div class="card card-soft mb-3">
<div class="card-body">
<form th:action="@{/add}" method="post" th:object="${newTask}"
      class="row g-2 align-items-center">

  <div class="col-lg-5">
    <input type="text" th:field="*{title}" class="form-control"
           placeholder="タスク名" required>
  </div>

  <div class="col-lg-2">
    <select th:field="*{priority}" class="form-select">
      <option th:each="p : ${priorities}"
              th:value="${p}" th:text="${p}"></option>
    </select>
  </div>

  <div class="col-lg-2">
    <select th:field="*{genre.id}" class="form-select">
      <option th:each="g : ${genres}"
              th:value="${g.id}" th:text="${g.genre}"></option>
    </select>
  </div>

  <div class="col-lg-2">
    <input type="date" th:field="*{dueDate}" class="form-control">
  </div>

  <div class="col-lg-1 d-grid">
    <button class="btn btn-primary pill">
      <i class="bi bi-plus-lg"></i>
    </button>
  </div>

</form>
</div>
</div>

<!-- ===== Add Genre ===== -->


<div class="card card-soft mb-3">
<div class="card-body">
<form th:action="@{/addGenre}" method="post" th:object="${newGenre}"
      class="row g-2 align-items-center">

  <div class="col-lg-5">
    <input type="text" th:field="*{genre}" class="form-control"
           placeholder="ジャンル名" required>
  </div>

  <div class="col-lg-1 d-grid">
    <button class="btn btn-primary pill">
      <i class="bi bi-plus-lg"></i>
    </button>
  </div>

</form>
</div>
</div>

<!-- ===== 進捗バー + 評価ボタン ===== -->
  <div class="d-flex align-items-center gap-3">

    <!-- 進捗バー -->
    <div class="flex-grow-1">
      <div class="progress" style="height: 14px;">
        <div class="progress-bar"
             role="progressbar"
             th:style="'width:' + ${progress} + '%'"
             th:classappend="
               ${progress} == 100 ? ' bg-success' :
               (${progress} >= 70 ? ' bg-info' :
               (${progress} >= 40 ? ' bg-warning' : ' bg-danger'))
             ">
        </div>
      </div>
      <div class="small mt-1 text-muted" th:text="${progress + '% 達成'}"></div>
    </div>

    <!-- 評価ボタン -->
    <button class="btn"
            data-bs-toggle="modal"
            data-bs-target="#evaluationModal"
            th:classappend="
              ${progress} == 100 ? ' btn-success' :
              (${progress} >= 70 ? ' btn-info' :
              (${progress} >= 40 ? ' btn-warning' : ' btn-outline-secondary'))
            ">
      <span th:if="${progress == 100}">★★★★★</span>
      <span th:if="${progress >= 80 and progress < 100}">★★★★☆</span>
      <span th:if="${progress >= 60 and progress < 80}">★★★☆☆</span>
      <span th:if="${progress >= 40 and progress < 60}">★★☆☆☆</span>
      <span th:if="${progress < 40}">★☆☆☆☆</span>
    </button>

  </div>


<p></p>

<!-- ===== Task List ===== -->
<div class="card card-soft">
<div class="card-body p-0">

<!-- ===== Genre Tabs ===== -->
<ul class="nav nav-tabs px-4 pt-3" role="tablist">
  <li class="nav-item">
    <button class="nav-link active"
            data-bs-toggle="tab"
            data-bs-target="#tab-all">ALL</button>
  </li>
  <li class="nav-item" th:each="g : ${genres}">
    <button class="nav-link"
            data-bs-toggle="tab"
            th:data-bs-target="'#tab-genre-' + ${g.id}"
            th:text="${g.genre}">
    </button>
  </li>
</ul>

<div class="tab-content">

<!-- ===== ALL ===== -->
<div class="tab-pane fade show active" id="tab-all">
<ul class="list-group list-group-flush px-3 pb-3">
<li th:each="task,stat:${tasks}" class="list-group-item">

<div class="bg-white p-3 task-row d-flex justify-content-between align-items-center">

<div>
  <div class="task-title"
       th:text="${task.title}"
       th:classappend="${task.completed}?' completed':''"></div>

  <div class="small muted d-flex gap-2 mt-1">
    <span class="badge text-bg-info pill"
          th:if="${task.genre!=null}"
          th:text="${task.genre.genre}"></span>

    <span th:if="${task.dueDate!=null}">
      <i class="bi bi-calendar3"></i>
      <span th:text="${task.dueDate}"></span>
    </span>
  </div>
</div>

<div class="d-flex gap-2">
<form th:action="@{/complete/{id}(id=${task.id})}" method="post">
<button class="btn pill"
        th:classappend="${task.completed}?' btn-outline-secondary':' btn-success'">
<i class="bi" th:classappend="${task.completed}?' bi-arrow-counterclockwise':' bi-check2'"></i>
</button>
</form>

<a th:href="@{/delete/{id}(id=${task.id})}"
   class="btn btn-outline-danger pill">
<i class="bi bi-trash"></i>
</a>
</div>

</div>
<div th:if="${!stat.last}" class="divider"></div>
</li>
</ul>
</div>

<!-- ===== Genre ===== -->
<div class="tab-pane fade"
     th:each="g:${genres}"
     th:id="'tab-genre-'+${g.id}">
<ul class="list-group list-group-flush px-3 pb-3">

<li th:each="task,stat:${tasks}"
    th:if="${task.genre!=null and task.genre.id==g.id}"
    class="list-group-item">

<div class="bg-white p-3 task-row d-flex justify-content-between align-items-center">

<div>
  <div class="task-title"
       th:text="${task.title}"
       th:classappend="${task.completed}?' completed':''"></div>
</div>

<div class="d-flex gap-2">
<form th:action="@{/complete/{id}(id=${task.id})}" method="post">
<button class="btn btn-success pill">
<i class="bi bi-check2"></i>
</button>
</form>

<a th:href="@{/delete/{id}(id=${task.id})}"
   class="btn btn-outline-danger pill">
<i class="bi bi-trash"></i>
</a>
</div>

</div>
<div th:if="${!stat.last}" class="divider"></div>
</li>

<li class="list-group-item"
    th:with="gid=${g.id}"
    th:if="${#lists.isEmpty(tasks.?[genre!=null and genre.id==#vars.gid])}">
<div class="text-center muted py-4">
このジャンルのタスクはありません
</div>
</li>

</ul>
</div>

</div>
</div>
</div>
</div>
</div>
<!-- リリンちゃん -->
<div id="assistant-widget" class="collapsed">

  <!-- 吹き出し -->
  <div class="speech-bubble" id="assistantMessage">
    <span th:text="${message}"></span>
  </div>

  <!-- キャラ（タップで喋る） -->
  <div class="assistant-main" onclick="onAssistantTap()">
    <img th:src="${image}" class="assistant-image">
  </div>

  <!-- 進捗ミニ表示 -->
  <div class="assistant-mini-footer">
    <span th:text="${progress + '%'}"></span>
  </div>

  <!-- ★ 非表示オーディオ -->
  <audio id="assistantVoice" th:src="${voice}"></audio>

</div>


<div class="text-center small muted mt-3">© TODO Calendar</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- ===== Notification 修正済 ===== -->
<script>
async function notifyIfTodayTasksIncomplete() {
  try {
    const res = await fetch('/api/tasks/today/incomplete');
    if (!res.ok) return;
    const tasks = await res.json();
    if (!tasks.length) return;

    if (Notification.permission === "default") {
      await Notification.requestPermission();
    }
    if (Notification.permission !== "granted") return;

    const titles = tasks.slice(0,3).map(t=>"・"+t.title).join("\n");
    const more = tasks.length>3 ? `\n…他 ${tasks.length-3}件` : "";

    new Notification("17:00 リマインド", {
      body: `今日のタスクがまだ残ってるよ（${tasks.length}件）\n${titles}${more}`
    });
  } catch(e){ console.error(e); }
}

const modal = document.getElementById('evaluationModal');
  modal.addEventListener('shown.bs.modal', () => {
    const audio = document.getElementById('voicePlayer');
    audio.currentTime = 0;
    audio.play();
  });
  
  window.addEventListener("load", () => {
    const bubble = document.getElementById("assistantMessage");

    if (bubble) {
      setTimeout(() => {
        bubble.style.opacity = "0";
      }, 4000); // 4秒後にフェード開始
    }
  });
  
  function toggleAssistant() {
    const widget = document.getElementById("assistant-widget");
    widget.classList.toggle("expanded");
  }
  
  let floatStopTimer = null;
  const FLOAT_STOP_DELAY = 3000; // ← ここで秒数調整（ms）

  function startFloating() {
    const widget = document.getElementById("assistant-widget");

    widget.classList.add("assistant-speaking");

    // 既存タイマーがあればクリア
    if (floatStopTimer) {
      clearTimeout(floatStopTimer);
    }

    // 一定時間後に浮遊停止
    floatStopTimer = setTimeout(() => {
      widget.classList.remove("assistant-speaking");
    }, FLOAT_STOP_DELAY);
  }

  function onAssistantTap() {
    const audio = document.getElementById("assistantVoice");

    if (!audio) return;

    if (audio.paused) {
      audio.currentTime = 0;
      audio.play();
      startFloating();
    } else {
      audio.pause();
      startFloating(); // タップした＝反応した扱い
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    const audio = document.getElementById("assistantVoice");

    if (!audio) return;

    audio.addEventListener("ended", () => {
      // 終了後も即止めず、余韻用タイマー
      startFloating();
    });
  });
</script>

</body>
</html>
